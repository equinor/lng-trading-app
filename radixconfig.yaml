apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: lng-fundamentals-app
spec:
  build:
    useBuildKit: true
  environments:
    - name: dev
      build:
        from: main
    - name: prod
      build:
        from: release
  components:
    - name: backend
      src: "."
      dockerfileName: backend/Dockerfile
      ports:
        - name: http
          port: 8000
      secrets:
        - DATABRICKS_SERVER_HOSTNAME
        - DATABRICKS_HTTP_PATH
        - DATABRICKS_TENANT_ID
        - DATABRICKS_CLIENT_ID
        - DATABRICKS_CLIENT_SECRET
        - DATABRICKS_WORKSPACE_RESOURCE_ID
      variables:
        NEWS_TABLE: ms_vulcan_gplng_plab.trader_news_app.platts_lng_top_news
        PIPELINE_NOMINATIONS_GOLD_TABLE: ms_vulcan_gplng_plab.fundamentals_gold.us_lng_feedgas_tracking
        LNG_BALANCE_SUPPLY_TABLE: ms_vulcan_gplng_plab.fundamentals_silver.lng_balance_model_daily_supply_latest
        LNG_BALANCE_DEMAND_TABLE: ms_vulcan_gplng_plab.fundamentals_silver.lng_balance_model_daily_demand_latest
        LNG_BALANCE_SUPPLY_HISTORY_TABLE: ms_vulcan_gplng_plab.fundamentals_silver.lng_balance_model_daily_supply
        LNG_BALANCE_DEMAND_HISTORY_TABLE: ms_vulcan_gplng_plab.fundamentals_silver.lng_balance_model_daily_demand
        FLARE_MONITOR_SCHEMA: ms_vulcan_gplng_plab.trader_news_app
        DATABRICKS_USE_SERVICE_PRINCIPAL: "true"
        DATABRICKS_WORKSPACE_URL: adb-1023210238843247.7.azuredatabricks.net
        DATABRICKS_JOB_ID: "93951735174333"
        FIRST_SUPERUSER: csee@equinor.com
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          memory: "1024Mi"
      healthChecks:
        livenessProbe:
          httpGet:
            port: 8000
            path: /api/v1/utils/health-check
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            port: 8000
            path: /api/v1/utils/health-check
          initialDelaySeconds: 10
          periodSeconds: 10

    - name: flare-collector
      # Background worker with no port. It reads the flare camera frames from WoodMac's camera
      # API with a login token that publish_token stores in Databricks (run on a machine that can
      # sign in to WoodMac), classifies them and writes the observations to Databricks.
      src: "."
      dockerfileName: backend/Dockerfile.collector
      replicas: 1
      secrets:
        - DATABRICKS_SERVER_HOSTNAME
        - DATABRICKS_HTTP_PATH
        - DATABRICKS_TENANT_ID
        - DATABRICKS_CLIENT_ID
        - DATABRICKS_CLIENT_SECRET
        - DATABRICKS_WORKSPACE_RESOURCE_ID
      variables:
        DATABRICKS_USE_SERVICE_PRINCIPAL: "true"
        FLARE_SOURCE: api
        FLARE_MONITOR_SCHEMA: ms_vulcan_gplng_plab.trader_news_app
        FLARE_IMAGE_TIMEZONE: America/New_York
        FLARE_CACHE_HOURS: "6"
        # Cameras to track: image camera ID, WoodMac camera name and flare region. Empty tracks every camera.
        FLARE_CAMERAS: '{"1209": {"plant": "Cameron Train 3"}, "1186": {"plant": "Cameron Trains 1 & 2"}, "1222": {"plant": "Corpus Christi Trains 1, 2, & 3"}, "1575": {"plant": "Corpus Christi Trains 4, 5, 6, 7"}, "1576": {"plant": "Corpus Christi Trains 7, 8, 9, & 10"}, "1093": {"plant": "Cove Point Train"}, "1597": {"plant": "Golden Pass Train 1"}, "1571": {"plant": "LNG Canada Train 1"}, "1577": {"plant": "LNG Canada Flare", "roi": [0, 0, 0.4, 0.55]}, "1559": {"plant": "Plaquemines Power 1"}, "1611": {"plant": "Plaquemines Power 2"}, "1211": {"plant": "Sabine Pass Trains 5 & 6"}, "858": {"plant": "Sabine Trains 1 & 2"}, "703": {"plant": "Sabine Trains 3 & 4"}}'
      resources:
        requests:
          cpu: "250m"
          memory: "1024Mi"
        limits:
          memory: "2048Mi"

    - name: frontend
      src: "."
      dockerfileName: frontend/Dockerfile
      ports:
        - name: http
          port: 8080
      publicPort: http
      environmentConfig:
        - environment: dev
          variables:
            VITE_BYPASS_AUTH: "false"
          authentication:
            oauth2:
              # Azure AD App Registration (client) ID that fronts the app.
              clientId: 60283d4b-f774-407b-983b-a22dcfeb6d03
              scope: "openid profile email"
              setXAuthRequestHeaders: true
              # Forward the JWT so the backend can read the app-role claim.
              setAuthorizationHeader: true
              sessionStoreType: systemManaged
        - environment: prod
          variables:
            VITE_BYPASS_AUTH: "false"
          authentication:
            oauth2:
              # Azure AD App Registration (client) ID that fronts the app.
              clientId: 60283d4b-f774-407b-983b-a22dcfeb6d03
              scope: "openid profile email"
              # Forward the authenticated identity to the app as
              # X-Auth-Request-Email / X-Auth-Request-User headers.
              setXAuthRequestHeaders: true
              # Forward the JWT so the backend can read the app-role claim.
              setAuthorizationHeader: true
              sessionStoreType: systemManaged
